name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4.0'
          opam-pin: false
      - run: opam install ocamlfind dune
      - run: python tests/runtime_identity.py
