name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-cache:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v
      - uses: actions/checkout@v4
        with:
          ref: 76c042621d034657f69ad41b41c1704520fd037b
          path: previous
      - name: Restore the completed Windows build
        uses: ./previous
        id: first
        env:
          MAKEFLAGS: --question
        with:
          version: 479825350e902c868b7b8c2ad918eaac073f3494
      - name: Clean the actual private switch with the fix
        id: cleanup
        shell: python
        env:
          CACHE_HIT: ${{ steps.first.outputs.cache-hit }}
        run: |
          import json, os, pathlib, stat, sys
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          import build
          assert os.environ['CACHE_HIT'] == 'true'
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          states = [p for p in root.glob('install-fstar-*/state.json') if json.loads(p.read_text()).get('opamroot')]
          assert len(states) == 1, states
          state = json.loads(states[0].read_text())
          (root / 'probe-state.json').write_text(json.dumps(state))
          report = pathlib.Path(state['work']) / 'environment.json'
          (root / 'environment-before.json').write_bytes(report.read_bytes())
          private = pathlib.Path(state['opamroot'])
          executable = private / 'build/bin/cppo.exe'
          print('cppo.exe attributes:', executable.stat().st_file_attributes)
          print('read-only:', bool(executable.stat().st_file_attributes & stat.FILE_ATTRIBUTE_READONLY))
          build.remove_private_root(private)
          assert not private.exists()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
              outputs.write('root=' + str(private) + '\n')
      - name: Restore the private dependencies again
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cleanup.outputs.root }}
          key: install-fstar-opam-v2-8507b8e58be2e8f634b15b1cac9482d7df204185cbaabb159158771304136b22-6124ef5acf9ee3d3a37c286daf4a86365de7ab00eba46620c728a32e0df62173
          fail-on-cache-miss: true
      - name: Reconcile and require the identical OCaml environment
        shell: python
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          import build
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          state = json.loads((root / 'probe-state.json').read_text())
          before = json.loads((root / 'environment-before.json').read_text())
          build.dependencies(state)
          build.fingerprint(state)
          after = json.loads((pathlib.Path(state['work']) / 'environment.json').read_text())
          first, second = before['data']['files'], after['data']['files']
          for path in sorted(first.keys() | second.keys()):
              if first.get(path) != second.get(path):
                  print('Changed:', path, first.get(path), second.get(path))
          print('Before:', before['fingerprint'])
          print('After: ', after['fingerprint'])
          assert before['fingerprint'] == after['fingerprint']
