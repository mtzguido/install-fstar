name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4.0'
          opam-pin: false
      - name: Compare native plugin loading before and after stripping
        shell: python
        run: |
          import pathlib, shutil, subprocess
          pathlib.Path('api.ml').write_text('let answer = 42\n')
          pathlib.Path('plugin.ml').write_text('let () = assert (Api.answer = 42); print_endline "Plugin loaded"\n')
          pathlib.Path('main.ml').write_text('let () = Dynlink.loadfile "./plugin.cmxs"\n')
          def run(args, check=True):
              print('+', ' '.join(args), flush=True)
              return subprocess.run(args, check=check)
          run(['opam', 'exec', '--', 'ocamlopt', '-linkall', 'dynlink.cmxa', 'api.ml', 'main.ml', '-o', 'original.exe'])
          run(['opam', 'exec', '--', 'ocamlopt', '-shared', 'plugin.ml', '-o', 'plugin.cmxs'])
          run(['./original.exe'])
          for name, flags in [('plain', []), ('debug', ['-S']), ('nonglobal', ['-x'])]:
              target = name + '.exe'
              shutil.copyfile('original.exe', target)
              pathlib.Path(target).chmod(0o755)
              run(['strip', *flags, target])
              symbols = subprocess.check_output(['nm', '-g', target], text=True)
              print('API symbols:', [line for line in symbols.splitlines() if 'camlApi' in line], flush=True)
              result = run(['./' + target], check=False)
              print(name, 'exit:', result.returncode, flush=True)
              if name == 'debug':
                  assert result.returncode == 0
